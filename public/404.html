<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Page Not Found | ChatPro365</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #09090b;
      color: #e4e4e7;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .code { font-size: 72px; font-weight: 800; color: #10b981; line-height: 1; }
    h1 { font-size: 24px; font-weight: 700; color: #fff; margin: 16px 0 8px; }
    p { color: #a1a1aa; font-size: 15px; max-width: 420px; margin: 0 auto 32px; line-height: 1.6; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: background-color .15s;
    }
    .primary { background: #10b981; color: #fff; }
    .primary:hover { background: #059669; }
    .secondary { border: 1px solid #3f3f46; color: #d4d4d8; }
    .secondary:hover { background: #18181b; }
  </style>
</head>

<body>
  <main>
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link may be broken or the page may have moved. Let's get you back on track.</p>
    <div class="links">
      <a class="primary" href="/">Go to homepage</a>
      <a class="secondary" href="/contact">Contact us</a>
    </div>
  </main>
</body>

</html>
